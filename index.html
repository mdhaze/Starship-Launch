<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T-MINUS</title>
<style>
  :root{
    --bg:#0b1c2e;
    --ink:#e8ecef;
    --ink-dim:#8a9bb0;
    --nominal:#4a9eff;
    --hold:#ffb020;
    --scrub:#ff3b30;
    --go:#37e07a;
    --stale:#ff3b30;
    --rule: rgba(255,255,255,0.12);
    --accent: var(--nominal);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--ink);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    transition: background 0.6s ease;
  }
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Space Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    height:100dvh; width:100vw;
    padding: 2.5vh 4vw;
  }
  .eyebrow{
    font-size: clamp(11px, 1.6vw, 15px);
    letter-spacing: 0.28em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 0.8vh;
  }
  .mission{
    font-size: clamp(14px, 2.2vw, 24px);
    letter-spacing: 0.06em;
    color: var(--ink);
    text-align:center;
    max-width: 94vw;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pad{
    font-size: clamp(11px, 1.3vw, 14px);
    color: var(--ink-dim);
    letter-spacing: 0.12em;
    margin-top: 0.3vh;
    text-transform: uppercase;
  }
  .status-pill{
    margin-top: 1.6vh;
    padding: 0.45em 1.2em;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: clamp(11px, 1.4vw, 14px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    transition: color .4s, border-color .4s;
  }
  .status-pill.pulse{ animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ opacity:1; } 50%{ opacity:.45; }
  }
  .clock{
    margin-top: 2vh;
    font-size: clamp(28px, 9vw, 120px);
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 35%, transparent);
    transition: color .4s;
    white-space: nowrap;
    text-align: center;
  }
  .clock.has-days{ font-size: clamp(24px, 7.5vw, 95px); }

  /* Secondary / Tertiary timers */
  .sub-timers{
    margin-top: 2.2vh;
    display:flex;
    flex-direction:column;
    gap: 1.1vh;
    align-items:center;
    width:100%;
    max-width: 520px;
  }
  .sub-row{
    display:flex;
    align-items:center;
    gap: 10px;
    font-size: clamp(13px, 2.1vw, 18px);
    color: var(--ink-dim);
  }
  .sub-label{
    min-width: 110px;
    text-align:right;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.85em;
  }
  .sub-value{
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    min-width: 90px;
    text-align:center;
    font-size: 1.15em;
  }
  .sub-input{
    width: 52px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95em;
    text-align:center;
    padding: 3px 4px;
    border-radius: 6px;
  }
  .sub-input:focus{ outline: none; border-color: var(--nominal); }

  .footer{
    position:absolute;
    bottom: 2.8vh;
    left:0; right:0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 14px;
    font-size: clamp(11px, 1.4vw, 13px);
    color: var(--ink-dim);
  }
  .sync-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--hold);
  }
  #syncBtn{
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    font-family: inherit;
    font-size: inherit;
    letter-spacing: 0.12em;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  #syncBtn:active{ opacity: 0.7; }
  .errbar{
    position:absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: #2a0a0a;
    color: #ff8a80;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 8px;
    display:none;
    max-width: 90vw;
    text-align:center;
  }
  .errbar.show{ display:block; }
  .version{
    position:absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    color: rgba(255,255,255,0.2);
  }
  canvas#fireworks{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index: 5;
  }
</style>
</head>
<body>
  <canvas id="fireworks"></canvas>

  <div class="eyebrow">Next SpaceX Launch</div>
  <div class="mission" id="mission">Loading…</div>
  <div class="pad" id="pad"></div>
  <div class="status-pill" id="statusPill">SYNCING</div>

  <div class="clock" id="clock">--:--:--</div>

  <div class="sub-timers" id="subTimers" style="display:none;">
    <div class="sub-row">
      <div class="sub-label">Booster</div>
      <div class="sub-value" id="boosterVal">--:--</div>
      <input class="sub-input" id="boosterMin" type="number" value="7" min="1" max="20" step="0.5" title="Minutes after liftoff">
      <span style="font-size:0.8em;opacity:0.6">min</span>
    </div>
    <div class="sub-row">
      <div class="sub-label">Ship</div>
      <div class="sub-value" id="shipVal">--:--</div>
      <input class="sub-input" id="shipMin" type="number" value="65" min="20" max="120" step="1" title="Minutes after liftoff">
      <span style="font-size:0.8em;opacity:0.6">min</span>
    </div>
  </div>

  <div class="footer">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncText">connecting…</span>
    <button id="syncBtn">SYNC NOW</button>
  </div>

  <div class="errbar" id="errbar"></div>
  <div class="version">v2.5</div>

<script>
(function () {
  var API_URL = "https://ll.thespacedevs.com/2.2.0/launch/upcoming/?lsp__name=SpaceX&limit=1&mode=detailed";
  var POLL_MS = 10 * 60 * 1000;
  var MIN_MANUAL_GAP_MS = 60 * 1000;
  var STALE_WARN_MS = 12 * 60 * 1000;
  var STALE_BAD_MS  = 20 * 60 * 1000;

  var target = null;
  var missionName = null;
  var padName = null;
  var statusName = null;
  var inHold = false;
  var lastSyncAt = null;
  var lastSyncFailed = false;
  var lastManualAt = 0;
  var liftoffTriggered = false;
  var t30Triggered = false;
  var lastHourTriggered = -1;
  var liftoffTime = null;          // actual Date when we first detected liftoff

  var el = {
    mission: document.getElementById('mission'),
    pad: document.getElementById('pad'),
    pill: document.getElementById('statusPill'),
    clock: document.getElementById('clock'),
    syncText: document.getElementById('syncText'),
    syncDot: document.getElementById('syncDot'),
    syncBtn: document.getElementById('syncBtn'),
    errbar: document.getElementById('errbar'),
    root: document.documentElement,
    subTimers: document.getElementById('subTimers'),
    boosterVal: document.getElementById('boosterVal'),
    shipVal: document.getElementById('shipVal'),
    boosterMin: document.getElementById('boosterMin'),
    shipMin: document.getElementById('shipMin')
  };

  function setColors(accent, bg){
    el.root.style.setProperty('--accent', accent);
    el.root.style.setProperty('--bg', bg);
  }

  function fmtAgo(ms){
    if (ms < 60000) return Math.round(ms/1000) + 's ago';
    var m = Math.floor(ms/60000);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m/60);
    return h + 'h ' + (m%60) + 'm ago';
  }

  function pad2(n){ return String(Math.max(0, Math.floor(n))).padStart(2,'0'); }

  function showError(msg){
    el.errbar.textContent = msg;
    el.errbar.classList.add('show');
  }
  function clearError(){ el.errbar.classList.remove('show'); }

  // -------------------- FIREWORKS --------------------
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let fireworksActive = false;
  let fireworksEndTime = 0;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function createFirework(x, y) {
    const colors = ['#ff3b30', '#ff9500', '#ffcc00', '#37e07a', '#4a9eff', '#bf5af2', '#ff2d55'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    const count = 50 + Math.random() * 30;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 2 + Math.random() * 4.5;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.015 + Math.random() * 0.012,
        color: color,
        size: 2 + Math.random() * 2
      });
    }
  }

  function launchFireworks(durationMs = 14000) {
    fireworksActive = true;
    fireworksEndTime = Date.now() + durationMs;
    createFirework(canvas.width / 2, canvas.height * 0.35);
    const interval = setInterval(() => {
      if (Date.now() > fireworksEndTime) {
        clearInterval(interval);
        return;
      }
      if (Math.random() < 0.35) {
        createFirework(
          canvas.width * (0.2 + Math.random() * 0.6),
          canvas.height * (0.15 + Math.random() * 0.35)
        );
      }
    }, 400);
  }

  function updateFireworks() {
    if (!fireworksActive && particles.length === 0) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.045;
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (particles.length === 0 && Date.now() > fireworksEndTime) {
      fireworksActive = false;
    }
  }
  setInterval(updateFireworks, 16);

  // -------------------- DATA --------------------
  async function fetchData(manual){
    try {
      var res = await fetch(API_URL, { cache: 'no-store' });
      if (res.status === 429) {
        lastSyncFailed = true;
        showError('RATE LIMITED — backing off, will retry automatically');
        return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var launch = data && data.results && data.results[0];
      if (!launch) throw new Error('no upcoming launch returned');

      missionName = launch.name || 'Unnamed mission';
      padName = (launch.pad && (launch.pad.name || '')) +
                (launch.pad && launch.pad.location && launch.pad.location.name ? ' · ' + launch.pad.location.name : '');
      statusName = (launch.status && (launch.status.abbrev || launch.status.name)) || 'Unknown';
      inHold = !!launch.inhold;
      var netStr = launch.window_start || launch.net;
      target = netStr ? new Date(netStr) : null;

      if (target && target > new Date()) {
        liftoffTriggered = false;
        t30Triggered = false;
        liftoffTime = null;
      }

      lastSyncAt = new Date();
      lastSyncFailed = false;
      clearError();
    } catch (err) {
      lastSyncFailed = true;
      showError('SYNC FAILED — showing last known data (' + (err.message || 'network error') + ')');
    } finally {
      renderStaticFields();
    }
  }

  function renderStaticFields(){
    el.mission.textContent = missionName || 'No upcoming launch found';
    el.pad.textContent = padName && padName.trim() !== '·' ? padName : '';
  }

  function statusLook(){
    if (!target) {
      return {label:'NO DATA', accent:'#8a9bb0', bg:'#0b1c2e', pulse:false};
    }

    var s = (statusName || '').toLowerCase();

    if (s.indexOf('scrub') > -1) {
      return {label:'SCRUBBED', accent:'#ff3b30', bg:'#2a0a0a', pulse:false};
    }
    if (inHold) {
      return {label:'HOLDING', accent:'#ffb020', bg:'#2a1f0a', pulse:true};
    }
    if (s.indexOf('fail') > -1) {
      return {label:'FAILURE', accent:'#ff3b30', bg:'#2a0a0a', pulse:false};
    }
    if (s.indexOf('success') > -1 || s.indexOf('launched') > -1) {
      return {label:'LAUNCHED', accent:'#37e07a', bg:'#0a2a15', pulse:false};
    }
    if (s.indexOf('tbd') > -1) {
      return {label:'DATE TBD', accent:'#ffb020', bg:'#2a1f0a', pulse:false};
    }

    var now = new Date();
    var diffMs = target - now;

    if (diffMs <= 0) {
      if (!liftoffTriggered) {
        liftoffTriggered = true;
        liftoffTime = new Date();          // record actual detection time
        launchFireworks(14000);
      }
      return {label:'LIFTOFF', accent:'#37e07a', bg:'#0a2a15', pulse:true};
    }

    if (diffMs <= 30 * 60 * 1000) {
      if (!t30Triggered) {
        t30Triggered = true;
        launchFireworks(6000);
      }
      return {label:'GO FOR LAUNCH', accent:'#37e07a', bg:'#0a2a15', pulse:false};
    }

    return {label:'GO FOR LAUNCH', accent:'#4a9eff', bg:'#0b1c2e', pulse:false};
  }

  function formatSub(ms) {
    if (ms <= 0) return 'NOW';
    var totalSec = Math.floor(ms / 1000);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return pad2(m) + ':' + pad2(s);
  }

  function tick(){
    var look = statusLook();
    setColors(look.accent, look.bg);
    el.pill.textContent = look.label;
    el.pill.classList.toggle('pulse', look.pulse);

    var now = new Date();

    // Hourly fireworks
    var hour = now.getHours();
    var minutes = now.getMinutes();
    var seconds = now.getSeconds();
    if (minutes === 0 && seconds === 0) {
      if (lastHourTriggered !== hour) {
        lastHourTriggered = hour;
        if (target && (target - now) > 0) {
          launchFireworks(5000);
        }
      }
    }

    // Main clock
    if (liftoffTriggered && liftoffTime) {
      // Post-liftoff: show mission elapsed time (T+)
      var elapsed = now - liftoffTime;
      var totalSec = Math.floor(elapsed / 1000);
      var hrs  = Math.floor(totalSec / 3600);
      var mins = Math.floor((totalSec % 3600) / 60);
      var secs = totalSec % 60;
      el.clock.textContent = 'T+' + (hrs > 0 ? hrs + ':' : '') + pad2(mins) + ':' + pad2(secs);
      el.clock.classList.remove('has-days');

      // Show and update secondary timers
      el.subTimers.style.display = 'flex';

      var boosterOffsetMs = parseFloat(el.boosterMin.value || 7) * 60 * 1000;
      var shipOffsetMs    = parseFloat(el.shipMin.value || 65) * 60 * 1000;

      el.boosterVal.textContent = formatSub(boosterOffsetMs - elapsed);
      el.shipVal.textContent    = formatSub(shipOffsetMs - elapsed);

    } else if (target) {
      // Pre-liftoff countdown
      el.subTimers.style.display = 'none';
      var diffMs = target - now;
      var neg = diffMs < 0;
      var abs = Math.abs(diffMs);
      var totalSec = Math.floor(abs / 1000);
      var days = Math.floor(totalSec / 86400);
      var hrs  = Math.floor((totalSec % 86400) / 3600);
      var mins = Math.floor((totalSec % 3600) / 60);
      var secs = totalSec % 60;

      var sign = neg ? '+' : '-';
      var main = 'T' + sign + (days > 0 ? days + 'd ' : '') +
                 pad2(hrs) + ':' + pad2(mins) + ':' + pad2(secs);

      el.clock.textContent = main;
      el.clock.classList.toggle('has-days', days > 0);
    } else {
      el.clock.textContent = '--:--:--';
      el.subTimers.style.display = 'none';
    }

    // Sync status line
    if (lastSyncAt) {
      var age = Date.now() - lastSyncAt.getTime();
      el.syncText.textContent = lastSyncFailed
        ? 'last sync failed · ' + fmtAgo(age)
        : 'synced ' + fmtAgo(age);
      el.syncDot.style.background = lastSyncFailed ? 'var(--scrub)' :
        (age > STALE_BAD_MS ? 'var(--scrub)' :
         age > STALE_WARN_MS ? 'var(--hold)' : 'var(--go)');
    } else {
      el.syncText.textContent = lastSyncFailed ? 'sync failed' : 'connecting…';
      el.syncDot.style.background = lastSyncFailed ? 'var(--scrub)' : 'var(--hold)';
    }
  }

  // -------------------- BUTTON + POLLING --------------------
  el.syncBtn.addEventListener('click', function () {
    var now = Date.now();
    if (now - lastManualAt < MIN_MANUAL_GAP_MS) return;
    lastManualAt = now;
    el.pill.textContent = 'SYNCING';
    el.pill.classList.add('pulse');
    fetchData(true);
  });

  // Initial fetch + polling
  fetchData(false);
  setInterval(function () { fetchData(false); }, POLL_MS);
  setInterval(tick, 100);
  tick();
})();
</script>
</body>
</html>

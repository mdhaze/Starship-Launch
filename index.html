<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T-MINUS</title>
<style>
  :root{
    --bg:#0b1c2e;
    --ink:#e8ecef;
    --ink-dim:#8a9bb0;
    --nominal:#4a9eff;
    --hold:#ffb020;
    --scrub:#ff3b30;
    --go:#37e07a;
    --stale:#ff3b30;
    --rule: rgba(255,255,255,0.12);
    --accent: var(--nominal);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--ink);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    transition: background 0.6s ease;
  }
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Space Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    height:100dvh; width:100vw;
    padding: 4vh 4vw;
  }
  .eyebrow{
    font-size: clamp(11px, 1.6vw, 16px);
    letter-spacing: 0.3em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 1.2vh;
  }
  .mission{
    font-size: clamp(15px, 2.4vw, 26px);
    letter-spacing: 0.08em;
    color: var(--ink);
    text-align:center;
    max-width: 92vw;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pad{
    font-size: clamp(11px, 1.4vw, 15px);
    color: var(--ink-dim);
    letter-spacing: 0.15em;
    margin-top: 0.4vh;
    text-transform: uppercase;
  }
  .status-pill{
    margin-top: 2.2vh;
    padding: 0.5em 1.4em;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: clamp(12px, 1.6vw, 16px);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    transition: color .4s, border-color .4s;
  }
  .status-pill.pulse{ animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ opacity:1; } 50%{ opacity:.45; }
  }
  .clock{
    margin-top: 3vh;
    font-size: clamp(38px, 11.5vw, 160px);
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 35%, transparent);
    transition: color .4s;
    white-space:nowrap;
    padding: 0 0.2em;
    max-width: 96vw;
  }
  .clock.has-days{
    font-size: clamp(30px, 8.5vw, 120px);
  }
  .clock .tenths{
    font-size: 0.4em;
    color: var(--ink-dim);
    margin-left: 0.12em;
  }
  .footer{
    margin-top: 3.5vh;
    display:flex; align-items:center; gap: 2vw;
    font-size: clamp(10px, 1.3vw, 13px);
    color: var(--ink-dim);
    letter-spacing: 0.08em;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--ink-dim);
    display:inline-block; margin-right:0.5em;
  }
  .dot.ok{ background: var(--go); }
  .dot.stale{ background: var(--stale); }
  button{
    background:none; border:1px solid var(--rule); color:var(--ink-dim);
    font-family:inherit; font-size: clamp(10px,1.2vw,12px);
    letter-spacing:0.15em; text-transform:uppercase;
    padding:0.5em 1em; border-radius:6px;
    -webkit-appearance:none;
  }
  button:active{ background: var(--rule); }
  button:disabled{ opacity:0.35; }
  .errbar{
    position:fixed; bottom:2vh; left:0; right:0;
    text-align:center;
    font-size: clamp(10px,1.3vw,13px);
    color: var(--stale);
    letter-spacing: 0.1em;
    opacity:0; transition:opacity .3s;
  }
  .errbar.show{ opacity:1; }

  #fireworks {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
  }

  .version {
    position: fixed;
    bottom: 14px;
    right: 16px;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.05em;
    opacity: 0.75;
    z-index: 50;
  }

  /* Extra protection for phones */
  @media (max-width: 500px) {
    body {
      padding: 3vh 5vw;
    }
    .clock {
      font-size: clamp(34px, 12vw, 92px);
      padding: 0 0.25em;
    }
    .clock.has-days {
      font-size: clamp(26px, 9vw, 72px);
    }
  }

  @media (prefers-reduced-motion: reduce){
    .status-pill.pulse{ animation:none; }
  }
</style>
</head>
<body>

  <canvas id="fireworks"></canvas>

  <div class="eyebrow">Next SpaceX Launch</div>
  <div class="mission" id="mission">Loading…</div>
  <div class="pad" id="pad">&nbsp;</div>

  <div class="status-pill" id="statusPill">SYNCING</div>

  <div class="clock" id="clock">--:--:--<span class="tenths" id="tenths">.-</span></div>

  <div class="footer">
    <span><span class="dot" id="syncDot"></span><span id="syncText">connecting…</span></span>
    <button id="syncBtn">Sync now</button>
  </div>

  <div class="errbar" id="errbar"></div>
  <div class="version">v2.3</div>

<script>
(function(){
  // ---- Config -------------------------------------------------------
  var API_URL = "https://ll.thespacedevs.com/2.2.0/launch/upcoming/?lsp__name=SpaceX&limit=1&mode=detailed";
  var POLL_MS = 10 * 60 * 1000;
  var MIN_MANUAL_GAP_MS = 60 * 1000;
  var STALE_WARN_MS = 12 * 60 * 1000;
  var STALE_BAD_MS  = 20 * 60 * 1000;

  // ---- State ----------------------------------------------------------
  var target = null;
  var missionName = null;
  var padName = null;
  var statusName = null;
  var inHold = false;
  var lastSyncAt = null;
  var lastSyncFailed = false;
  var lastManualAt = 0;
  var liftoffTriggered = false;
  var t30Triggered = false;
  var lastHourTriggered = -1;

  var el = {
    mission: document.getElementById('mission'),
    pad: document.getElementById('pad'),
    pill: document.getElementById('statusPill'),
    clock: document.getElementById('clock'),
    tenths: document.getElementById('tenths'),
    syncText: document.getElementById('syncText'),
    syncDot: document.getElementById('syncDot'),
    syncBtn: document.getElementById('syncBtn'),
    errbar: document.getElementById('errbar'),
    root: document.documentElement
  };

  function setColors(accent, bg){
    el.root.style.setProperty('--accent', accent);
    el.root.style.setProperty('--bg', bg);
  }

  function fmtAgo(ms){
    if (ms < 60000) return Math.round(ms/1000) + 's ago';
    var m = Math.floor(ms/60000);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m/60);
    return h + 'h ' + (m%60) + 'm ago';
  }

  function pad2(n){ return String(Math.max(0,n)).padStart(2,'0'); }

  function showError(msg){
    el.errbar.textContent = msg;
    el.errbar.classList.add('show');
  }
  function clearError(){ el.errbar.classList.remove('show'); }

  // -------------------- FIREWORKS --------------------
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let fireworksActive = false;
  let fireworksEndTime = 0;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function createFirework(x, y) {
    const colors = ['#ff3b30', '#ff9500', '#ffcc00', '#37e07a', '#4a9eff', '#bf5af2', '#ff2d55'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    const count = 50 + Math.random() * 30;

    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 2 + Math.random() * 4.5;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.015 + Math.random() * 0.012,
        color: color,
        size: 2 + Math.random() * 2
      });
    }
  }

  function launchFireworks(durationMs = 14000) {
    fireworksActive = true;
    fireworksEndTime = Date.now() + durationMs;

    createFirework(canvas.width / 2, canvas.height * 0.35);

    const interval = setInterval(() => {
      if (Date.now() > fireworksEndTime) {
        clearInterval(interval);
        return;
      }
      const x = canvas.width * (0.2 + Math.random() * 0.6);
      const y = canvas.height * (0.15 + Math.random() * 0.35);
      createFirework(x, y);
    }, 600);
  }

  function updateFireworks() {
    if (!fireworksActive && particles.length === 0) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.045;
      p.life -= p.decay;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (particles.length === 0 && Date.now() > fireworksEndTime) {
      fireworksActive = false;
    }
  }
  setInterval(updateFireworks, 16);

  // -------------------- DATA --------------------
  async function fetchData(manual){
    try {
      var res = await fetch(API_URL, { cache: 'no-store' });
      if (res.status === 429) {
        lastSyncFailed = true;
        showError('RATE LIMITED — backing off, will retry automatically');
        return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var launch = data && data.results && data.results[0];
      if (!launch) throw new Error('no upcoming launch returned');

      missionName = launch.name || 'Unnamed mission';
      padName = (launch.pad && (launch.pad.name || '')) +
                (launch.pad && launch.pad.location && launch.pad.location.name ? ' · ' + launch.pad.location.name : '');
      statusName = (launch.status && (launch.status.abbrev || launch.status.name)) || 'Unknown';
      inHold = !!launch.inhold;
      var netStr = launch.window_start || launch.net;
      target = netStr ? new Date(netStr) : null;

      if (target && target > new Date()) {
        liftoffTriggered = false;
        t30Triggered = false;
      }

      lastSyncAt = new Date();
      lastSyncFailed = false;
      clearError();
    } catch

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T-MINUS</title>
<style>
  :root{
    --bg:#0b1c2e;          /* default blue */
    --ink:#e8ecef;
    --ink-dim:#8a9bb0;
    --nominal:#4a9eff;     /* blue */
    --hold:#ffb020;
    --scrub:#ff3b30;
    --go:#37e07a;          /* green */
    --stale:#ff3b30;
    --rule: rgba(255,255,255,0.12);
    --accent: var(--nominal);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--ink);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    transition: background 0.6s ease;
  }
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Space Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    height:100dvh; width:100vw;
    padding: 4vh 4vw;
  }
  .eyebrow{
    font-size: clamp(11px, 1.6vw, 16px);
    letter-spacing: 0.3em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 1.2vh;
  }
  .mission{
    font-size: clamp(16px, 2.6vw, 28px);
    letter-spacing: 0.08em;
    color: var(--ink);
    text-align:center;
    max-width: 90vw;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pad{
    font-size: clamp(11px, 1.4vw, 15px);
    color: var(--ink-dim);
    letter-spacing: 0.15em;
    margin-top: 0.4vh;
    text-transform: uppercase;
  }
  .status-pill{
    margin-top: 2.2vh;
    padding: 0.5em 1.4em;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: clamp(12px, 1.6vw, 16px);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    transition: color .4s, border-color .4s;
  }
  .status-pill.pulse{ animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ opacity:1; } 50%{ opacity:.45; }
  }
  .clock{
    margin-top: 3vh;
    font-size: clamp(64px, 17vw, 220px);
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 35%, transparent);
    transition: color .4s;
    white-space:nowrap;
  }
  .clock.has-days{
    font-size: clamp(40px, 11vw, 150px);
  }
  .clock .tenths{
    font-size: 0.4em;
    color: var(--ink-dim);
    margin-left: 0.15em;
  }
  .sign{
    font-size: 0.5em;
    vertical-align: 0.12em;
    margin-right: 0.15em;
    color: var(--ink-dim);
  }
  .footer{
    margin-top: 3.5vh;
    display:flex; align-items:center; gap: 2vw;
    font-size: clamp(10px, 1.3vw, 13px);
    color: var(--ink-dim);
    letter-spacing: 0.08em;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--ink-dim);
    display:inline-block; margin-right:0.5em;
  }
  .dot.ok{ background: var(--go); }
  .dot.stale{ background: var(--stale); }
  button{
    background:none; border:1px solid var(--rule); color:var(--ink-dim);
    font-family:inherit; font-size: clamp(10px,1.2vw,12px);
    letter-spacing:0.15em; text-transform:uppercase;
    padding:0.5em 1em; border-radius:6px;
    -webkit-appearance:none;
  }
  button:active{ background: var(--rule); }
  button:disabled{ opacity:0.35; }
  .errbar{
    position:fixed; bottom:2vh; left:0; right:0;
    text-align:center;
    font-size: clamp(10px,1.3vw,13px);
    color: var(--stale);
    letter-spacing: 0.1em;
    opacity:0; transition:opacity .3s;
  }
  .errbar.show{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    .status-pill.pulse{ animation:none; }
  }
</style>
</head>
<body>

  <div class="eyebrow">Next SpaceX Launch</div>
  <div class="mission" id="mission">Loading…</div>
  <div class="pad" id="pad">&nbsp;</div>

  <div class="status-pill" id="statusPill">SYNCING</div>

  <div class="clock" id="clock">--:--:--<span class="tenths" id="tenths">.-</span></div>

  <div class="footer">
    <span><span class="dot" id="syncDot"></span><span id="syncText">connecting…</span></span>
    <button id="syncBtn">Sync now</button>
  </div>

  <div class="errbar" id="errbar"></div>

<script>
(function(){
  // ---- Config -------------------------------------------------------
  var API_URL = "https://ll.thespacedevs.com/2.2.0/launch/upcoming/?lsp__name=SpaceX&limit=1&mode=detailed";
  var POLL_MS = 10 * 60 * 1000;
  var MIN_MANUAL_GAP_MS = 60 * 1000;
  var STALE_WARN_MS = 12 * 60 * 1000;
  var STALE_BAD_MS  = 20 * 60 * 1000;

  // ---- State ----------------------------------------------------------
  var target = null;
  var missionName = null;
  var padName = null;
  var statusName = null;
  var inHold = false;
  var lastSyncAt = null;
  var lastSyncFailed = false;
  var lastManualAt = 0;
  var liftoffLatched = false;

  var el = {
    mission: document.getElementById('mission'),
    pad: document.getElementById('pad'),
    pill: document.getElementById('statusPill'),
    clock: document.getElementById('clock'),
    tenths: document.getElementById('tenths'),
    syncText: document.getElementById('syncText'),
    syncDot: document.getElementById('syncDot'),
    syncBtn: document.getElementById('syncBtn'),
    errbar: document.getElementById('errbar'),
    root: document.documentElement
  };

  function setColors(accent, bg){
    el.root.style.setProperty('--accent', accent);
    el.root.style.setProperty('--bg', bg);
  }

  function fmtAgo(ms){
    if (ms < 60000) return Math.round(ms/1000) + 's ago';
    var m = Math.floor(ms/60000);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m/60);
    return h + 'h ' + (m%60) + 'm ago';
  }

  function pad2(n){ return String(Math.max(0,n)).padStart(2,'0'); }

  function showError(msg){
    el.errbar.textContent = msg;
    el.errbar.classList.add('show');
  }
  function clearError(){ el.errbar.classList.remove('show'); }

  async function fetchData(manual){
    try {
      var res = await fetch(API_URL, { cache: 'no-store' });
      if (res.status === 429) {
        lastSyncFailed = true;
        showError('RATE LIMITED — backing off, will retry automatically');
        return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var launch = data && data.results && data.results[0];
      if (!launch) throw new Error('no upcoming launch returned');

      missionName = launch.name || 'Unnamed mission';
      padName = (launch.pad && (launch.pad.name || '')) +
                (launch.pad && launch.pad.location && launch.pad.location.name ? ' · ' + launch.pad.location.name : '');
      statusName = (launch.status && (launch.status.abbrev || launch.status.name)) || 'Unknown';
      inHold = !!launch.inhold;
      var netStr = launch.window_start || launch.net;
      target = netStr ? new Date(netStr) : null;
      liftoffLatched = false;

      lastSyncAt = new Date();
      lastSyncFailed = false;
      clearError();
    } catch (err) {
      lastSyncFailed = true;
      showError('SYNC FAILED — showing last known data (' + (err.message || 'network error') + ')');
    } finally {
      renderStaticFields();
    }
  }

  function renderStaticFields(){
    el.mission.textContent = missionName || 'No upcoming launch found';
    el.pad.textContent = padName && padName.trim() !== '·' ? padName : '';
  }

  function statusLook(){
    // Returns {label, accent, bg, pulse}
    if (!target) {
      return {label:'NO DATA', accent:'#8a9bb0', bg:'#0b1c2e', pulse:false};
    }

    var s = (statusName || '').toLowerCase();

    // Scrubbed always wins → red
    if (s.indexOf('scrub') > -1) {
      return {label:'SCRUBBED', accent:'#ff3b30', bg:'#2a0a0a', pulse:false};
    }

    if (inHold) {
      return {label:'HOLDING', accent:'#ffb020', bg:'#2a1f0a', pulse:true};
    }
    if (s.indexOf('fail') > -1) {
      return {label:'FAILURE', accent:'#ff3b30', bg:'#2a0a0a', pulse:false};
    }
    if (s.indexOf('success') > -1) {
      return {label:'LAUNCHED', accent:'#37e07a', bg:'#0a2a15', pulse:false};
    }
    if (s.indexOf('tbd') > -1) {
      return {label:'DATE TBD', accent:'#ffb020', bg:'#2a1f0a', pulse:false};
    }

    var now = new Date();
    var diffMs = target - now;

    // Liftoff
    if (diffMs <= 0) {
      return {label:'LIFTOFF', accent:'#37e07a', bg:'#0a2a15', pulse:true};
    }

    // Final 30 minutes → green “real countdown”
    if (diffMs <= 30 * 60 * 1000) {
      return {label:'GO FOR LAUNCH', accent:'#37e07a', bg:'#0a2a15', pulse:false};
    }

    // Normal countdown → blue
    return {label:'GO FOR LAUNCH', accent:'#4a9eff', bg:'#0b1c2e', pulse:false};
  }

  function tick(){
    var look = statusLook();
    setColors(look.accent, look.bg);
    el.pill.textContent = look.label;
    el.pill.classList.toggle('pulse', look.pulse);

    if (target){
      var now = new Date();
      var diffMs = target - now;
      var neg = diffMs < 0;
      var abs = Math.abs(diffMs);
      var totalSec = Math.floor(abs/1000);
      var days = Math.floor(totalSec/86400);
      var hh = Math.floor((totalSec%86400)/3600);
      var mm = Math.floor((totalSec%3600)/60);
      var ss = totalSec%60;
      var tenths = Math.floor((abs%1000)/100);
      var hasDays = days > 0;
      el.clock.classList.toggle('has-days', hasDays);

      if (inHold){
        el.clock.childNodes[0].nodeValue = 'T\u2212 ' + '00:00:00';
        el.tenths.textContent = '';
      } else {
        var sign = neg ? 'T+ ' : 'T\u2212 ';
        var dayPart = hasDays ? (days + 'D + ') : '';
        el.clock.childNodes[0].nodeValue = sign + dayPart + pad2(hh) + ':' + pad2(mm) + ':' + pad2(ss);
        el.tenths.textContent = '.' + tenths;
      }
    } else {
      el.clock.classList.remove('has-days');
      el.clock.childNodes[0].nodeValue = '--:--:--';
      el.tenths.textContent = '';
    }

    // sync freshness
    if (lastSyncAt){
      var age = Date.now() - lastSyncAt.getTime();
      el.syncText.textContent = 'synced ' + fmtAgo(age) + (lastSyncFailed ? ' (retry pending)' : '');
      el.syncDot.className = 'dot ' + (lastSyncFailed || age > STALE_BAD_MS ? 'stale' : (age > STALE_WARN_MS ? '' : 'ok'));
    } else {
      el.syncText.textContent = lastSyncFailed ? 'sync failed' : 'connecting…';
      el.syncDot.className = 'dot' + (lastSyncFailed ? ' stale' : '');
    }
  }

  el.syncBtn.addEventListener('click', function(){
    var now = Date.now();
    if (now - lastManualAt < MIN_MANUAL_GAP_MS){
      showError('Please wait a bit before syncing again (rate-limit protection)');
      return;
    }
    lastManualAt = now;
    fetchData(true);
  });

  fetchData(false);
  setInterval(fetchData, POLL_MS);
  setInterval(tick, 100);
})();
</script>
</body>
</html>
